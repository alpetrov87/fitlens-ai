name: Inspect public ITRA profile
on:
  push:
    branches: ['feature/fitlens-android-mvp']
    paths: ['.github/workflows/inspect-itra.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Render and inspect public ITRA profile
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee itra-inspect-output.txt) 2>&1
          url='https://itra.run/RunnerSpace/petrov.aleksandar.7422083'
          curl --fail --location --compressed --user-agent 'Mozilla/5.0 (Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36' \
            --dump-header headers.txt --output profile.html "$url"
          sed -n '1,40p' headers.txt
          wc -c profile.html
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=25000 --log-net-log=netlog.json --net-log-capture-mode=Default \
            --dump-dom "$url" > rendered.html
          python3 - <<'PY'
          import html, re
          from pathlib import Path
          page=Path('rendered.html').read_text(errors='replace')
          text=html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>|<[^>]+>', ' ', page, flags=re.I|re.S))
          text=re.sub(r'\s+', ' ', text).strip()
          print('VISIBLE TEXT:', text[:50000])
          raw=Path('netlog.json').read_text(errors='replace')
          print('NETWORK URLS:')
          for value in sorted(set(re.findall(r'https?://[^"\\ ]+', raw))):
            value=value.replace(r'\u0026','&')
            if 'itra.run' in value or any(k in value.lower() for k in ('runner','result','race','index')):
              print(value[:1500])
          print('RENDERED MATCHES:')
          for key in ('Performance Index','General','Endurance','Mountain','Finisher','ITRA 1','ITRA 2','ITRA 3','ITRA 4','ITRA 5','ITRA 6'):
            for match in list(re.finditer(r'.{0,200}'+re.escape(key)+r'.{0,400}', text, re.I))[:10]:
              print(key, match.group(0))
          print('HTML FORM/ACTION CANDIDATES:')
          for value in sorted(set(re.findall(r'["\']([^"\']*(?:RunnerSpace|RaceResults|api|result|index)[^"\']*)["\']', page, re.I))):
            if len(value)<1000: print(value)
          PY
      - name: Publish temporary result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itra-inspect-output.txt
          git commit -m 'Record temporary ITRA inspection output'
          git push
