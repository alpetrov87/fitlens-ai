name: Verify live runner profiles
on:
  push:
    branches: ['feature/fitlens-android-mvp']
    paths: ['.github/workflows/verify-live-profiles.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/fitlens-android-sdk"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})"
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute production importer against both profiles
        shell: bash
        run: |
          set +e
          FITLENS_LIVE_TESTS=true ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests com.fitlens.ai.data.RunnerProfileLiveImportTest > live-import-gradle.log 2>&1
          status=$?
          set -e
          cp app/build/test-results/testDebugUnitTest/TEST-com.fitlens.ai.data.RunnerProfileLiveImportTest.xml live-import-result.xml
          echo "gradle_exit=$status" > live-import-status.txt
      - name: Publish temporary result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-import-result.xml live-import-status.txt
          git commit -m 'Record temporary live profile test result'
          git push
