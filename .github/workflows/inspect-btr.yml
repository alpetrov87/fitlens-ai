name: Inspect public BTR profile
on:
  push:
    branches: ['feature/fitlens-android-mvp']
    paths: ['.github/workflows/inspect-btr.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect public profile response
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee btr-inspect-output.txt) 2>&1
          url='https://www.my-btr.com/runners/019e8190-3121-7052-9561-037b2ac2d68c'
          curl --fail --location --compressed --user-agent 'Mozilla/5.0 (Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36' \
            --dump-header headers.txt --output profile.html "$url"
          sed -n '1,40p' headers.txt
          wc -c profile.html
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path
          page = Path('profile.html').read_text(errors='replace')
          print('TITLE:', re.findall(r'<title[^>]*>(.*?)</title>', page, re.I|re.S)[:3])
          print('SCRIPTS:')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', page, re.I): print(src)
          print('MATCHING TEXT:')
          text = html.unescape(re.sub(r'<[^>]+>', ' ', page))
          text = re.sub(r'\s+', ' ', text)
          for word in ('place','rank','position','ranking','място','класиране','points','score'):
              for m in list(re.finditer(r'.{0,120}'+word+r'.{0,200}', text, re.I))[:8]: print(word, m.group(0))
          print('JSON/API CANDIDATES:')
          candidates = set(re.findall(r'["\']([^"\']*(?:api|runner|ranking|result|standing)[^"\']*)["\']', page, re.I))
          for value in sorted(candidates):
              if len(value) < 500: print(value)
          print('HTML PREFIX:', page[:5000])
          PY
      - name: Inspect public JavaScript bundles
        shell: bash
        run: |
          set -euo pipefail
          exec >> btr-inspect-output.txt 2>&1
          python3 - <<'PY'
          import re, subprocess, urllib.parse
          from pathlib import Path
          page = Path('profile.html').read_text(errors='replace')
          base = 'https://www.my-btr.com/'
          sources = re.findall(r'<script[^>]+src=["\']([^"\']+)', page, re.I)
          for index, src in enumerate(sources[:30]):
              url = urllib.parse.urljoin(base, src)
              out = f'bundle-{index}.js'
              subprocess.run(['curl','--fail','--location','--compressed','--silent','--show-error',url,'-o',out], check=False)
              path = Path(out)
              if not path.exists() or path.stat().st_size > 10_000_000: continue
              data = path.read_text(errors='replace')
              print('\nBUNDLE', url, len(data))
              patterns = [r'.{0,160}/api/.{0,240}', r'.{0,160}(?:rank|position|place|standing|score).{0,240}', r'.{0,160}/runners/.{0,240}']
              found=[]
              for pattern in patterns:
                  found.extend(m.group(0) for m in list(re.finditer(pattern, data, re.I))[:30])
              for value in found[:60]: print(value[:500])
          PY
      - name: Publish temporary inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add btr-inspect-output.txt
          git commit -m 'Record temporary BTR inspection output'
          git push
