name: Android debug APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the single-owner Garmin bridge without credentials
        run: |
          python -m pip install -r backend/workouts/requirements-test.txt
          python -m unittest discover -s backend/workouts/tests -v
      - name: Build the backend image without deploying it
        run: docker build -f backend/workouts/Dockerfile -t bair-workouts-ci backend/workouts
      - name: Smoke-test pinned Garmin client imports without signing in
        run: docker run --rm --read-only --tmpfs /tmp:noexec,nosuid,size=32m --entrypoint python bair-workouts-ci -m backend.workouts.smoke
  build:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BAIR_WORKOUT_TEST_BUILD: ${{ github.ref == 'refs/heads/feature/workout-builder-garmin' || github.head_ref == 'feature/workout-builder-garmin' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/fitlens-android-sdk"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $RUNNER_TEMP/android-tools.zip" | sha1sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        shell: bash
        run: |
          # Feed enough license answers without a broken-pipe failure from yes.
          sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})"
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure APK version
        run: echo "FITLENS_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Configure optional persistent signing outside workout test builds
        if: env.BAIR_WORKOUT_TEST_BUILD != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FITLENS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FITLENS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FITLENS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FITLENS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "FITLENS_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            signing_path="$RUNNER_TEMP/fitlens-signing.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_path"
            chmod 600 "$signing_path"
            echo "FITLENS_KEYSTORE_PATH=$signing_path" >> "$GITHUB_ENV"
            echo "FITLENS_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FITLENS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FITLENS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Persistent signing is not configured. This APK may require uninstalling an older debug build."
          fi
      - name: Build, test and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Record APK provenance
        env:
          RUN_BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_COMMIT: ${{ github.sha }}
        run: |
          printf 'Branch: %s\nCommit: %s\nWorkout test build: %s\n' "$RUN_BRANCH" "$RUN_COMMIT" "$BAIR_WORKOUT_TEST_BUILD" > app/build/outputs/apk/debug/BUILD_INFO.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BAIR_WORKOUT_TEST_BUILD == 'true' && 'bair-workouts-test' || 'fitlens-ai-debug' }}-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
