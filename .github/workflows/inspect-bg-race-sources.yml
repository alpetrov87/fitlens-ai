name: Inspect Bulgarian race sources

on:
  push:
    paths:
      - .github/workflows/inspect-bg-race-sources.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fitlens-android-mvp
      - name: Inspect public sources
        shell: bash
        run: |
          set -u
          mkdir -p research
          urls=(
            "https://racecalendar.bg/"
            "https://racecalendar.bg/main-XXBF72U3.js"
            "https://api.racecalendar.bg/v1/api/race/search?fromDate=2026-10-24&toDate=2027-12-31&page=1&pageSize=100&distanceType=3&special=32"
            "https://api.racecalendar.bg/v1/api/race/search?fromDate=2026-10-24&toDate=2027-12-31&page=1&pageSize=100&distanceType=2"
            "https://bgmtb.com/"
            "https://bgmtb.com/calendar"
            "https://bgcf.bg/"
            "https://bgcf.bg/%D0%BA%D0%B0%D0%BB%D0%B5%D0%BD%D0%B4%D0%B0%D1%80/"
            "https://bgcf.bg/wp-json/wp/v2/mec-events?per_page=100"
            "https://itra.run/Races/RaceCalendar"
          )
          for url in "${urls[@]}"; do
            slug=$(printf '%s' "$url" | sha256sum | cut -c1-12)
            curl -L --max-time 45 -A 'Mozilla/5.0' -sS -D "research/$slug.headers" -o "research/$slug.html" "$url" || true
            printf '%s\n' "$url" > "research/$slug.url"
          done
          searches=(
            "календар трейл състезания България 2026"
            "календар MTB състезания България 2026"
            "site:bgmtb.com календар състезания"
            "site:bgcf.bg календар MTB"
            "ITRA race calendar Bulgaria"
          )
          n=0
          for query in "${searches[@]}"; do
            n=$((n+1))
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$query")
            curl -L --max-time 45 -A 'Mozilla/5.0' -sS "https://r.jina.ai/http://www.google.com/search?q=$encoded" -o "research/search-$n.txt" || true
            printf '%s\n' "$query" > "research/search-$n.query"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bg-race-source-inspection
          path: research
          retention-days: 1
      - name: Commit inspection result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research
          git commit -m "Record temporary Bulgarian race source inspection"
          git push
