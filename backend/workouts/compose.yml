services:
  backend:
    image: bair-workouts-local
    build:
      context: .
      dockerfile: Dockerfile
    user: "${BAIR_UID:?Set BAIR_UID}:${BAIR_GID:?Set BAIR_GID}"
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./private/data:/data
      - ./private/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
